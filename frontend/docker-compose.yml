# VM 배포용 compose. 백엔드(backend/docker-compose.yml)를 먼저 띄운 뒤 빌드해야 한다.
name: eatomato-commerce
services:
  frontend:
    build:
      context: .
      # 빌드 중 127.0.0.1:8080(백엔드 컨테이너)으로 상품·공지 데이터를 받아 오려고 host 네트워크를 쓴다.
      network: host
      args:
        API_BASE_URL: http://127.0.0.1:8080
        NEXT_PUBLIC_API_BASE_URL: ""
    image: eatomato-frontend
    container_name: eatomato-frontend
    # 런타임에도 127.0.0.1:8080 으로 백엔드를 부르므로 host 네트워크에서 돈다.
    # 외부 80/443 은 호스트 nginx 가 받아 127.0.0.1:3000 으로 넘긴다(저장소 루트 deploy/host-nginx/eatomato.kr.conf).
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "3000"
      API_BASE_URL: http://127.0.0.1:8080
    restart: unless-stopped
    mem_limit: 256m
