name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 저장소 Actions 탭에서 수동 실행할 수 있게 한다.
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한을 부여한다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만. 진행 중인 실행은 취소하지 않고 큐에 둔다
# (중간 상태로 사이트가 덮이는 것을 막기 위해).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        # GITHUB_PAGES=true 일 때만 basePath(/eatomato-commerce)가 붙는다.
        # 로컬 개발·빌드는 접두사 없이 그대로 동작한다.
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Disable Jekyll
        # GitHub Pages 는 기본적으로 Jekyll 로 처리해 밑줄로 시작하는 경로를 무시한다.
        # Next.js 자산이 _next/ 에 있으므로 이 파일이 없으면 CSS·JS 가 전부 404 가 된다.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
