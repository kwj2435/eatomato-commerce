spring:
  application:
    name: eatomato-backend
  datasource:
    # TLS 로 접속한다. MySQL 컨테이너는 기동 시 자체 서명 인증서를 만들어 두고,
    # sslMode=REQUIRED 는 암호화만 요구하고 인증서 검증은 하지 않으므로 그대로 붙는다.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eatomato}?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(db/migration) 가 관리한다.
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  task:
    # @Async(알림톡 발송). DB 연결 풀이 작아(5) 일괄 상태 변경 때 알림이 연결을 다 차지하지 않도록 2개로 둔다.
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 2
      shutdown:
        # 배포로 재시작할 때 대기 중인 알림을 잠깐 기다렸다가 내린다.
        await-termination: true
        await-termination-period: 20s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # 아이디·비밀번호 계정(이메일 가입·비밀번호 로그인·첫 관리자 생성). 운영은 끄고 카카오·네이버로만 가입·로그인한다.
  # 테스트(local 프로필)는 이 방식으로 회원을 만들어 쓴다.
  password-auth-enabled: ${PASSWORD_AUTH_ENABLED:false}
  jwt:
    # HS256 서명 키. 32바이트 이상의 임의 문자열이어야 한다.
    secret: ${JWT_SECRET}
    # 액세스 토큰은 짧게, 리프레시 토큰으로 자동 연장한다.
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://eatomato.kr}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    # 업로드 파일 URL 의 앞부분. 프론트와 출처가 달라 절대 URL 로 내려준다.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  seed:
    # 상품 테이블이 비어 있으면 프론트 mock 과 같은 데모 데이터를 넣는다.
    enabled: ${SEED_DEMO_DATA:true}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uris: ${KAKAO_REDIRECT_URIS:https://eatomato.kr/login/kakao/,http://localhost:3000/login/kakao/}
    # 휴대전화번호·연계정보(CI)를 가입 필수로 받을지. 카카오 비즈 앱 심사로 두 동의항목을 연 뒤에 true 로 켠다.
    require-phone-and-ci: ${KAKAO_REQUIRE_PHONE_CI:false}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uris: ${NAVER_REDIRECT_URIS:https://eatomato.kr/login/naver/,http://localhost:3000/login/naver/}
  payment:
    # mock: 결제가 항상 성공했다고 본다(개발용). toss: 토스페이먼츠 결제위젯.
    provider: ${PAYMENT_PROVIDER:mock}
    # PG 웹훅 공유 비밀. 비어 있으면 /api/payments/webhook 을 받지 않는다.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}
    # 토스페이먼츠 결제위젯 연동 키(개발자센터 > API 키 > 결제위젯 연동 키). provider=toss 면 둘 다 필요하다.
    toss-client-key: ${TOSS_CLIENT_KEY:}
    toss-secret-key: ${TOSS_SECRET_KEY:}
  login-limit:
    # 15분 안에 같은 계정으로 5번, 같은 IP 에서 20번 틀리면 남은 시간 동안 로그인을 막는다.
    max-per-account: 5
    max-per-ip: 20
    window: 15m
  admin:
    # 기동 시 이 계정을 관리자로 만든다(없으면 생성, 있으면 권한만 부여 — 비밀번호는 바꾸지 않는다).
    # password-auth-enabled 가 꺼져 있으면 쓰지 않는다. 운영 관리자는 카카오·네이버 계정에 관리자 화면에서 권한을 준다.
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:}
  insight:
    # 마케팅 인사이트 에이전트(Python 워커 insight-agent)와 주고받는 공유 토큰(X-Internal-Token).
    # 비어 있으면 /internal/insights 를 막는다(관리자 화면에서 요청은 쌓이지만 처리되지 않는다).
    agent-token: ${INSIGHT_AGENT_TOKEN:}
    # 하루 요청 수 상한(AI 비용 보호)
    daily-limit: ${INSIGHT_DAILY_LIMIT:10}
    # RUNNING 으로 이 시간이 지나면 워커가 멈춘 것으로 보고 실패 처리
    stale-after: 15m
  alimtalk:
    # 카카오 알림톡(솔라피). 키·채널·발신번호 중 하나라도 비어 있으면 보내지 않고 발송 기록에 SKIPPED 로만 남긴다.
    api-key: ${SOLAPI_API_KEY:}
    api-secret: ${SOLAPI_API_SECRET:}
    pf-id: ${SOLAPI_PF_ID:}
    sender: ${SOLAPI_SENDER:}
    # 카카오 검수를 받은 템플릿 ID. 비어 있는 종류는 보내지 않는다(검수가 끝난 것부터 하나씩 켤 수 있다).
    templates:
      ORDER_PAID: ${ALIMTALK_TEMPLATE_ORDER_PAID:}
      ORDER_PREPARING: ${ALIMTALK_TEMPLATE_ORDER_PREPARING:}
      ORDER_SHIPPING: ${ALIMTALK_TEMPLATE_ORDER_SHIPPING:}
      ORDER_CANCELLED: ${ALIMTALK_TEMPLATE_ORDER_CANCELLED:}

---
# DB 접속 정보 없이 실행해 보는 용도. `./gradlew bootRun --args='--spring.profiles.active=local'`
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:eatomato;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

app:
  # 로컬·테스트는 아이디·비밀번호로 회원을 만들고 로그인한다
  password-auth-enabled: true
  jwt:
    secret: local-development-secret-key-must-be-32-bytes-or-more
  admin:
    login-id: admin
    password: admin1234
  insight:
    # 로컬에서 Python 워커를 붙여 볼 때 쓰는 개발용 토큰(운영은 INSIGHT_AGENT_TOKEN)
    agent-token: ${INSIGHT_AGENT_TOKEN:local-insight-agent-token}
