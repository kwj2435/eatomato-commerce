[project]
name = "insight-agent"
version = "0.1.0"
description = "eatomato 마케팅 인사이트 에이전트 (Claude API tool use 워커)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "pandas>=2.2",
]

[project.scripts]
insight-agent = "insight_agent.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
