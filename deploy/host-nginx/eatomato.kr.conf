# VM 호스트 nginx 설정 (/etc/nginx/sites-available/eatomato.kr)
#
# 인터넷 → 호스트 nginx(80/443) ─┬─ /                → 127.0.0.1:3000 프론트 컨테이너
#                                 └─ /api/, /uploads/ → 127.0.0.1:8080 백엔드 컨테이너
#
# HTTPS(443) 블록과 80 → 443 리다이렉트는 `certbot --nginx` 가 이 파일에 덧붙인다.
server {
    listen 80;
    listen [::]:80;
    server_name eatomato.kr;

    # 후기 사진 업로드(최대 5장 × 10MB)
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
