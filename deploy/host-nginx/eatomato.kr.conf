# VM 호스트 nginx 설정 (/etc/nginx/sites-available/eatomato.kr, sites-enabled 에 심볼릭 링크)
#
# 인터넷 → 호스트 nginx(80/443) ─┬─ /                → 127.0.0.1:3000 프론트 컨테이너(Next.js)
#                                 └─ /api/, /uploads/ → 127.0.0.1:8080 백엔드 컨테이너
#
# 대표 주소는 https://eatomato.kr 하나다. www·http 는 모두 여기로 301.
# (로그인 세션은 브라우저 저장소가 도메인마다 따로라, 주소가 갈리면 로그인이 공유되지 않는다)
#
# 인증서: Let's Encrypt (eatomato.kr + www.eatomato.kr), certbot webroot 방식으로 자동 갱신.
#   sudo certbot certonly --webroot -w /var/www/html --cert-name eatomato.kr -d eatomato.kr -d www.eatomato.kr

# ── 80: 인증서 발급 확인만 받고 나머지는 https://eatomato.kr 로 ──────────
server {
    listen 80;
    listen [::]:80;
    server_name eatomato.kr www.eatomato.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://eatomato.kr$request_uri;
    }
}

# ── 443 www → 대표 주소 ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.eatomato.kr;

    ssl_certificate /etc/letsencrypt/live/eatomato.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatomato.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eatomato.kr$request_uri;
}

# ── 443 eatomato.kr ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name eatomato.kr;

    ssl_certificate /etc/letsencrypt/live/eatomato.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatomato.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 기본 보안 헤더. 토큰을 localStorage 에 두므로 클릭재킹·MIME 스니핑 같은 주입 경로를 줄여 둔다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 후기 사진 업로드(최대 5장 × 10MB)
    client_max_body_size 55m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
