# VM 호스트 nginx 설정 (/etc/nginx/sites-available/eatomato.kr, sites-enabled 에 심볼릭 링크)
#
# 인터넷 → 호스트 nginx(80/443) ─┬─ /                → 127.0.0.1:3000 프론트 컨테이너(Next.js)
#                                 └─ /api/, /uploads/ → 127.0.0.1:8080 백엔드 컨테이너
#
# 대표 주소는 https://eatomato.kr 하나다. www·http 는 모두 여기로 301.
# (로그인 세션은 브라우저 저장소가 도메인마다 따로라, 주소가 갈리면 로그인이 공유되지 않는다)
#
# 인증서: Let's Encrypt (eatomato.kr + www.eatomato.kr), certbot webroot 방식으로 자동 갱신.
#   sudo certbot certonly --webroot -w /var/www/html --cert-name eatomato.kr -d eatomato.kr -d www.eatomato.kr \
#     --deploy-hook "systemctl reload nginx"
# certonly 는 아래 include 하는 두 파일을 만들지 않으므로 certbot 패키지에서 복사해 둔다.
#   cp /usr/lib/python3/dist-packages/certbot/_internal/plugins/nginx/tls_configs/options-ssl-nginx.conf /etc/letsencrypt/
#   cp /usr/lib/python3/dist-packages/certbot/ssl-dhparams.pem /etc/letsencrypt/

# 로그인·가입 요청 속도 제한(IP 당 분당 10회, 순간 10회까지 허용). 앱의 계정별 잠금과 별도로 한 번 더 막는다.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# 주문 생성·취소·비회원 주문 조회 속도 제한(POST 만, IP 당 분당 10회, 순간 10회까지).
# 비회원 주문은 로그인 없이 재고를 30분 잡아 두므로, 반복 주문으로 전 상품을 품절로 만드는 것을 막는다.
# 비회원 주문 비밀번호 대입(/api/guest/orders/lookup)도 함께 느려진다. 키가 빈 값(GET)이면 제한하지 않는다.
map $request_method $order_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $order_limit_key zone=order:10m rate=10r/m;

# ── 80: 인증서 발급 확인만 받고 나머지는 https://eatomato.kr 로 ──────────
server {
    listen 80;
    listen [::]:80;
    server_name eatomato.kr www.eatomato.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://eatomato.kr$request_uri;
    }
}

# ── 443 www → 대표 주소 ─────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eatomato.kr;

    ssl_certificate /etc/letsencrypt/live/eatomato.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatomato.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://eatomato.kr$request_uri;
}

# ── 443 eatomato.kr ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    http2 on;
    server_name eatomato.kr;

    ssl_certificate /etc/letsencrypt/live/eatomato.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eatomato.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 기본 보안 헤더. 토큰을 localStorage 에 두므로 클릭재킹·MIME 스니핑 같은 주입 경로를 줄여 둔다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 후기 사진 업로드(최대 5장 × 10MB)
    client_max_body_size 55m;

    # 압축: 전역 설정은 HTML 만 압축해 API JSON·정적 JS/CSS 가 그대로 나갔다.
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    # 프록시 헤더는 여기 한 곳에서 정한다. location 에 proxy_set_header 를 하나라도 쓰면 이 값들이 통째로
    # 상속되지 않으므로, location 에는 proxy_set_header 를 두지 않는다.
    #
    # 클라이언트가 보낸 전달 헤더는 모두 nginx 가 본 값으로 덮어쓰거나 지운다. 백엔드(Spring
    # forward-headers-strategy: framework)는 이 헤더로 접속 IP·주소를 정하고, IP 별 로그인 잠금이 그 IP 를 쓴다.
    # - X-Forwarded-For: $proxy_add_x_forwarded_for 는 요청자가 보낸 값 뒤에 붙여 위조가 가능했다.
    # - Forwarded: Spring 은 RFC 7239 Forwarded 를 X-Forwarded-For 보다 먼저 읽는다. 지우지 않으면
    #   `Forwarded: for=<아무 IP>` 로 IP 별 제한을 우회하거나 남의 IP 를 잠글 수 있다.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    limit_req_status 429;

    location ~ ^/api/auth/(login|signup)$ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ ^/api/(orders|guest/orders)(/|$) {
        limit_req zone=order burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
